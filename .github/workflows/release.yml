name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: swift test
      - name: Package (universal)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export HOARDINI_VERSION="${GITHUB_REF_NAME#v}"; fi
          UNIVERSAL=1 ./scripts/package.sh
          unzip -l dist/*.zip | grep -E 'Helpers/|MacOS/|extension/manifest.json'
          echo "## SHA-256" > dist/notes.md
          (cd dist && shasum -a 256 *.zip | sed 's/^/    /') >> dist/notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Hoardini
          path: dist/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.zip
          body_path: dist/notes.md
          generate_release_notes: true
