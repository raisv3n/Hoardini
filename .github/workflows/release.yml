name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package (universal)
        run: UNIVERSAL=1 ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hoardini
          path: dist/Hoardini.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Hoardini.zip
          generate_release_notes: true
